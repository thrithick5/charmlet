<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Apple Green Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="20%" stop-color="#22c55e"/>
      <stop offset="65%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Warm Golden Center Jewel Gradient -->
    <radialGradient id="goldCenter" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="charmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#063517" flood-opacity="0.35"/>
    </filter>

    <!-- Heart-shaped clover leaflet pointing North from (0,0) -->
    <path id="leaflet" d="M0,0 C-75,-85 -180,-152 -180,-235 C-180,-308 -108,-354 -38,-314 C-16,-301 -6,-284 0,-262 C6,-284 16,-301 38,-314 C108,-354 180,-308 180,-235 C180,-152 75,-85 0,0 Z"/>
  </defs>

  <!-- iOS / macOS Squircle Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- Subtle ambient inner glow ring -->
  <rect width="1016" height="1016" x="4" y="4" rx="220" ry="220" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- Four-Leaf Clover Charm Group -->
  <g filter="url(#charmShadow)" transform="translate(512, 506)">
    <!-- Curved stem emerging from behind South-East quadrant -->
    <path d="M0,25 C35,140 120,270 230,320 C245,326 256,308 242,295 C150,235 75,130 30,20 Z" fill="#ffffff"/>

    <!-- Four Leaflets -->
    <g fill="#ffffff">
      <use href="#leaflet" transform="rotate(0)"/>
      <use href="#leaflet" transform="rotate(90)"/>
      <use href="#leaflet" transform="rotate(180)"/>
      <use href="#leaflet" transform="rotate(270)"/>
    </g>

    <!-- Center Warm Golden Core -->
    <circle cx="0" cy="0" r="72" fill="url(#goldCenter)"/>
    <!-- Specular highlight on golden core -->
    <circle cx="-18" cy="-18" r="18" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>
