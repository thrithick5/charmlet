<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Deep Apple dark-slate squircle with subtle emerald ambience -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#143324"/>
      <stop offset="55%" stop-color="#0b1e15"/>
      <stop offset="100%" stop-color="#040d09"/>
    </radialGradient>

    <!-- Clover Leaf Rich Emerald Radial Gradient -->
    <radialGradient id="leafGrad" cx="35%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="20%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#16a34a"/>
      <stop offset="82%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f3d1e"/>
    </radialGradient>

    <!-- Gold Cord & Jump Ring Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Pearl Bead Gradient -->
    <radialGradient id="pearlGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Royal Blue Center Accent Bead -->
    <radialGradient id="beadGrad" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="22%" stop-color="#3b82f6"/>
      <stop offset="68%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Leaf Drop Shadow -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#022111" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- iOS / macOS Squircle Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle ambient inner glow ring -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="none" stroke="rgba(74, 222, 128, 0.12)" stroke-width="2"/>

  <!-- Radial emerald glow behind clover -->
  <circle cx="512" cy="560" r="340" fill="#22c55e" opacity="0.12"/>

  <!-- Top Suspension Cord & Beads -->
  <g filter="url(#shadow)">
    <!-- Main gold braided cord -->
    <path d="M512 60 V180" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Top white pearl bead -->
    <circle cx="512" cy="204" r="18" fill="url(#pearlGrad)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Middle sapphire sphere bead -->
    <circle cx="512" cy="256" r="34" fill="url(#beadGrad)"/>
    <circle cx="500" cy="244" r="10" fill="#ffffff" opacity="0.95"/>
    <circle cx="524" cy="268" r="5" fill="#93c5fd" opacity="0.4"/>

    <!-- Bottom white pearl bead -->
    <circle cx="512" cy="308" r="18" fill="url(#pearlGrad)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Metallic Gold Jump-Ring -->
    <circle cx="512" cy="360" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="15"/>
  </g>

  <!-- Four-Leaf Clover Charm Body -->
  <g filter="url(#shadow)" transform="translate(512, 600)">
    <!-- Curving organic stem -->
    <path d="M0 0 C0 140 30 240 50 280 C54 288 40 294 30 284 C6 210 -20 120 -18 0 Z" fill="#15803d" stroke="#14532d" stroke-width="4"/>

    <!-- 4 Clover Leaves (Heart-shaped lobes with silver outer rim and emerald gradient) -->
    <!-- Top Leaf -->
    <g transform="rotate(0)">
      <path d="M0 -185 C-56 -300 -150 -280 -150 -180 C-150 -95 -60 -45 0 0 C60 -45 150 -95 150 -180 C150 -280 56 -300 0 -185 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="9"/>
      <path d="M0 -180 C-50 -285 -136 -270 -136 -180 C-136 -105 -50 -55 0 -10 C50 -55 136 -105 136 -180 C136 -270 50 -285 0 -180 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="5"/>
      <path d="M0 -25 C-3 -75 -3 -125 0 -150" stroke="#bbf7d0" stroke-width="6" opacity="0.85" stroke-linecap="round"/>
    </g>

    <!-- Right Leaf -->
    <g transform="rotate(90)">
      <path d="M0 -185 C-56 -300 -150 -280 -150 -180 C-150 -95 -60 -45 0 0 C60 -45 150 -95 150 -180 C150 -280 56 -300 0 -185 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="9"/>
      <path d="M0 -180 C-50 -285 -136 -270 -136 -180 C-136 -105 -50 -55 0 -10 C50 -55 136 -105 136 -180 C136 -270 50 -285 0 -180 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="5"/>
      <path d="M0 -25 C-3 -75 -3 -125 0 -150" stroke="#bbf7d0" stroke-width="6" opacity="0.85" stroke-linecap="round"/>
    </g>

    <!-- Bottom Leaf -->
    <g transform="rotate(180)">
      <path d="M0 -185 C-56 -300 -150 -280 -150 -180 C-150 -95 -60 -45 0 0 C60 -45 150 -95 150 -180 C150 -280 56 -300 0 -185 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="9"/>
      <path d="M0 -180 C-50 -285 -136 -270 -136 -180 C-136 -105 -50 -55 0 -10 C50 -55 136 -105 136 -180 C136 -270 50 -285 0 -180 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="5"/>
      <path d="M0 -25 C-3 -75 -3 -125 0 -150" stroke="#bbf7d0" stroke-width="6" opacity="0.85" stroke-linecap="round"/>
    </g>

    <!-- Left Leaf -->
    <g transform="rotate(270)">
      <path d="M0 -185 C-56 -300 -150 -280 -150 -180 C-150 -95 -60 -45 0 0 C60 -45 150 -95 150 -180 C150 -280 56 -300 0 -185 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="9"/>
      <path d="M0 -180 C-50 -285 -136 -270 -136 -180 C-136 -105 -50 -55 0 -10 C50 -55 136 -105 136 -180 C136 -270 50 -285 0 -180 Z" fill="url(#leafGrad)" stroke="#14532d" stroke-width="5"/>
      <path d="M0 -25 C-3 -75 -3 -125 0 -150" stroke="#bbf7d0" stroke-width="6" opacity="0.85" stroke-linecap="round"/>
    </g>

    <!-- Center core jewel -->
    <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#15803d"/>
  </g>
</svg>
